<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>EnRoute</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{
    --cream:#FBF4E8;
    --cream-2:#F4EADB;
    --ink:#28211A;
    --ink-soft:#6B6154;
    --gray:#9C9284;
    --line:#EEE2CC;
    --card:#FFFFFF;
    --tan:#C7B896;
    --tan-badge:#F3E6D4;
    --coral:#D9553A;
    --coral-dark:#B8422B;
    --coral-bg:#F8DDD2;
    --green:#3C5A45;
    --green-bg:#DCE6D3;
    --green-hero:#6B8F5D;
    --green-hero-2:#2F4B3A;
    --blue:#1F6E86;
    --blue-bg:#D6E7EC;
    --blue-hero:#6FB7C9;
    --blue-hero-2:#1F5C74;
    --heritage:#8B5E34;
    --heritage-hero:#C79A5D;
    --heritage-hero-2:#7A5230;
    --wildlife:#57623C;
    --wildlife-hero:#8C8F5C;
    --wildlife-hero-2:#46502F;
    --nature:#3C6B4A;
    --nature-hero:#7DA06B;
    --nature-hero-2:#2E4A34;
    --accent: var(--coral);
    --accent-bg: var(--coral-bg);
    --hero: var(--green-hero);
    --radius-lg:26px;
    --radius-md:16px;
    --radius-sm:12px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --cream:#1E1913;
      --cream-2:#251F17;
      --ink:#F5EFE2;
      --ink-soft:#CDC4B2;
      --gray:#948A7A;
      --line:#3B3324;
      --card:#282219;
      --tan-badge:#3B3221;
      --coral-bg:#4A2A22;
    }
  }
  :root[data-theme="dark"]{
    --cream:#1E1913;
    --cream-2:#251F17;
    --ink:#F5EFE2;
    --ink-soft:#CDC4B2;
    --gray:#948A7A;
    --line:#3B3324;
    --card:#282219;
    --tan-badge:#3B3221;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--cream);
    color:var(--ink);
    font-family:'Inter',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  h1,h2,h3,.serif{font-family:'Poppins',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;}
  #shell{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    background:var(--cream);
    position:relative;
    display:flex;
    flex-direction:column;
  }
  #screen{flex:1; padding-bottom:84px; overflow-x:hidden;}
  .px{padding-left:22px; padding-right:22px;}
  /* ---------- Top bars ---------- */
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:22px 22px 0 22px;
  }
  .icon-btn{
    width:44px; height:44px; border-radius:50%;
    background:var(--card); border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; color:var(--ink-soft); flex:none;
  }
  .icon-btn:hover{filter:brightness(0.97);}
  /* ---------- Home ---------- */
  .home-greeting{color:var(--gray); font-size:15px; margin:0 0 2px;}
  .home-title{font-size:34px; font-weight:800; margin:0; color:var(--ink);}
  .avatar{
    width:46px; height:46px; border-radius:50%;
    background:var(--tan-badge); display:flex; align-items:center; justify-content:center;
    color:var(--ink-soft);
  }
  .plan-btn{
    width:100%; margin-top:22px;
    background:var(--coral); color:#fff;
    border:none; border-radius:50px;
    padding:17px 20px; font-size:16px; font-weight:700;
    display:flex; align-items:center; justify-content:center; gap:8px;
    cursor:pointer; font-family:'Inter',sans-serif;
  }
  .plan-btn:hover{filter:brightness(1.05);}
  .section-head{
    display:flex; align-items:baseline; justify-content:space-between;
    margin:30px 0 12px;
  }
  .section-head h3{font-size:19px; margin:0; font-weight:700;}
  .link-accent{color:var(--coral); font-size:14px; font-weight:600; text-decoration:none; cursor:pointer; background:none; border:none; font-family:'Inter',sans-serif;}
  .upcoming-card{
    border-radius:var(--radius-lg); overflow:hidden; background:var(--card);
    border:1px solid var(--line); cursor:pointer;
    box-shadow:0 10px 28px rgba(140,90,50,0.10);
  }
  .hero-ph{
    height:170px; background:var(--hero, var(--green-hero));
    display:flex; align-items:center; justify-content:center; color:rgba(0,0,0,0.28);
    position:relative; overflow:hidden;
  }
  .upcoming-body{padding:16px 18px;}
  .upcoming-row{display:flex; align-items:flex-start; justify-content:space-between; gap:10px;}
  .upcoming-title{font-size:19px; font-weight:700; margin:0 0 4px;}
  .upcoming-sub{color:var(--gray); font-size:14px; margin:0;}
  .badge{
    background:var(--coral-bg); color:var(--coral-dark); font-size:12.5px; font-weight:700;
    border-radius:20px; padding:6px 12px; white-space:nowrap; flex:none;
  }
  .empty-note{color:var(--gray); font-size:14.5px; line-height:1.5; padding:18px 0;}
  .trip-row{
    display:flex; align-items:center; gap:14px;
    padding:14px 0; border-bottom:1px solid var(--line); cursor:pointer;
  }
  .trip-row:last-child{border-bottom:none;}
  .trip-thumb{
    width:52px; height:52px; border-radius:var(--radius-sm); flex:none;
    background:var(--tan-badge); display:flex; align-items:center; justify-content:center; color:var(--gray);
  }
  .trip-row-title{font-weight:700; font-size:16px; margin:0 0 2px;}
  .trip-row-sub{color:var(--gray); font-size:13.5px; margin:0;}
  .chevron{margin-left:auto; color:var(--gray); flex:none;}
  /* ---------- Bottom nav ---------- */
  .navbar{
    position:absolute; left:0; right:0; bottom:0;
    background:var(--cream); border-top:1px solid var(--line);
    display:flex; padding:10px 6px 14px;
    max-width:480px; margin:0 auto;
  }
  .nav-item{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:4px;
    background:none; border:none; cursor:pointer; color:var(--gray);
    font-family:'Inter',sans-serif; font-size:12px; font-weight:600; padding:4px 0;
  }
  .nav-item.active{color:var(--coral);}
  /* ---------- Wizard ---------- */
  .wizard-head{padding:22px; display:flex; align-items:center; gap:14px;}
  .progress-track{flex:1; height:5px; background:var(--line); border-radius:4px; overflow:hidden;}
  .progress-fill{height:100%; background:var(--coral); border-radius:4px; transition:width .25s;}
  .step-count{font-size:13px; color:var(--gray); font-weight:600; flex:none;}
  .wizard-body{padding:6px 22px 10px;}
  .wizard-title{font-size:24px; font-weight:700; margin:6px 0 6px;}
  .wizard-sub{color:var(--gray); font-size:14.5px; margin:0 0 22px; line-height:1.5;}
  .field{margin-bottom:20px;}
  .field label{display:block; font-size:13.5px; font-weight:700; color:var(--ink-soft); margin-bottom:8px;}
  .field input[type=text], .field input[type=date], .field input[type=time], .field input[type=number], .field textarea, .field select{
    width:100%; padding:14px 15px; border-radius:var(--radius-sm); border:1.5px solid var(--line);
    background:var(--card); color:var(--ink); font-size:15.5px; font-family:'Inter',sans-serif;
  }
  .field input:focus, .field textarea:focus, .field select:focus{outline:none; border-color:var(--coral);}
  .field textarea{resize:vertical; min-height:80px;}
  .ac-field{position:relative;}
  .ac-list{
    position:absolute; left:0; right:0; top:100%; margin-top:4px; background:var(--card);
    border:1px solid var(--line); border-radius:var(--radius-sm); box-shadow:0 8px 24px rgba(0,0,0,0.16);
    z-index:20; overflow:hidden; display:none; max-height:240px; overflow-y:auto;
  }
  .ac-list.show{display:block;}
  .ac-item{padding:12px 15px; font-size:14.5px; cursor:pointer; border-bottom:1px solid var(--line); color:var(--ink);}
  .ac-item:last-child{border-bottom:none;}
  .ac-item:hover{background:var(--cream-2);}
  .ac-hint{padding:10px 15px; font-size:12px; color:var(--gray); line-height:1.4;}
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .row-2{display:flex; gap:12px;}
  .row-2 .field{flex:1;}
  .chip-wrap{display:flex; flex-wrap:wrap; gap:10px;}
  .chip{
    padding:11px 17px; border-radius:24px; border:1.5px solid var(--line);
    background:var(--card); color:var(--ink-soft); font-size:14.5px; font-weight:600;
    cursor:pointer; font-family:'Inter',sans-serif; display:flex; align-items:center; gap:6px;
  }
  .chip.selected{background:var(--coral); border-color:var(--coral); color:#fff;}
  .chip .order-badge{
    background:rgba(255,255,255,0.3); border-radius:50%; width:18px; height:18px;
    font-size:11px; display:flex; align-items:center; justify-content:center;
  }
  .traveler-row{display:flex; align-items:center; gap:12px; margin-bottom:10px;}
  .traveler-row span{width:82px; font-size:14px; color:var(--ink-soft); flex:none;}
  .traveler-row input{flex:1;}
  .stepper-row{display:flex; align-items:center; gap:14px;}
  .stepper-btn{
    width:38px; height:38px; border-radius:50%; border:1.5px solid var(--line); background:var(--card);
    font-size:18px; color:var(--ink); cursor:pointer;
  }
  .wizard-nav{display:flex; gap:12px; padding:10px 22px 24px;}
  .btn-primary{
    flex:1; background:var(--coral); color:#fff; border:none; border-radius:50px;
    padding:16px; font-size:15.5px; font-weight:700; cursor:pointer; font-family:'Inter',sans-serif;
  }
  .btn-secondary{
    flex:none; background:var(--card); color:var(--ink); border:1.5px solid var(--line); border-radius:50px;
    padding:16px 22px; font-size:15.5px; font-weight:700; cursor:pointer; font-family:'Inter',sans-serif;
  }
  .review-block{background:var(--card); border:1px solid var(--line); border-radius:var(--radius-md); padding:16px 18px; margin-bottom:14px;}
  .review-label{font-size:12px; text-transform:uppercase; letter-spacing:0.04em; color:var(--gray); font-weight:700; margin:0 0 4px;}
  .review-value{font-size:15px; margin:0; color:var(--ink);}
  .info-note{
    background:var(--tan-badge); border-radius:var(--radius-md); padding:14px 16px;
    font-size:13.5px; color:var(--ink-soft); line-height:1.5; margin-bottom:18px;
  }
  /* ---------- Timeline ---------- */
  .tl-hero{height:280px; background:var(--hero); display:flex; align-items:flex-start; justify-content:space-between; padding:22px; position:relative; overflow:hidden;}
  .tl-body{background:var(--cream); padding:22px; position:relative; top:-1px;}
  .tl-title{font-size:28px; font-weight:800; margin:0 0 4px;}
  .tl-dates{color:var(--gray); font-size:15px; margin:0 0 18px;}
  .day-tabs{display:flex; gap:22px; border-bottom:1px solid var(--line); margin-bottom:22px; overflow-x:auto;}
  .day-tab{
    background:none; border:none; padding:0 0 12px; font-size:15px; font-weight:700; color:var(--gray);
    cursor:pointer; white-space:nowrap; font-family:'Inter',sans-serif; position:relative; flex:none;
  }
  .day-tab.active{color:var(--accent);}
  .day-tab.active::after{
    content:""; position:absolute; left:0; right:0; bottom:0; height:2px; background:var(--accent);
  }
  .tl-item{display:flex; gap:14px; margin-bottom:26px; position:relative;}
  .tl-time{width:56px; flex:none; text-align:right; padding-top:2px;}
  .tl-time .hm{font-weight:700; font-size:15px; display:block;}
  .tl-time .ap{font-size:11px; color:var(--gray); letter-spacing:0.03em;}
  .tl-marker{display:flex; flex-direction:column; align-items:center; flex:none; padding-top:6px;}
  .tl-dot{width:10px; height:10px; border-radius:50%; background:var(--accent); flex:none;}
  .tl-line{width:1.5px; flex:1; background:var(--line); margin-top:4px;}
  .tl-item:last-child .tl-line{display:none;}
  .tl-content{flex:1; padding-bottom:6px;}
  .tl-cat{
    color:var(--accent); font-size:11.5px; font-weight:800; letter-spacing:0.05em; text-transform:uppercase; margin:0 0 4px;
    display:flex; align-items:center; gap:6px;
  }
  .tl-item-title{font-size:17.5px; font-weight:700; margin:0 0 4px; font-family:'Poppins',sans-serif;}
  .tl-item-sub{color:var(--gray); font-size:14px; margin:0; line-height:1.45;}
  .tl-actions{display:flex; gap:12px; margin-top:8px;}
  .tl-action-btn{
    flex:1; display:flex; align-items:center; justify-content:center; gap:8px;
    background:var(--card); border:1.5px solid var(--line); border-radius:50px; padding:14px;
    font-size:14.5px; font-weight:700; color:var(--ink); cursor:pointer; font-family:'Inter',sans-serif;
  }
  .tl-action-btn.primary{background:var(--accent); color:#fff; border-color:var(--accent);}
  .more-menu{
    position:absolute; top:60px; right:22px; background:var(--card); border:1px solid var(--line);
    border-radius:var(--radius-sm); box-shadow:0 8px 24px rgba(0,0,0,0.14); overflow:hidden; z-index:5;
  }
  .more-menu button{
    display:block; width:100%; text-align:left; padding:13px 18px; background:none; border:none;
    font-size:14.5px; color:var(--ink); cursor:pointer; font-family:'Inter',sans-serif;
  }
  .more-menu button:hover{background:var(--cream-2);}
  .more-menu button.danger{color:#B3402C;}
  /* ---------- Simple pages ---------- */
  .page-title{font-size:28px; font-weight:800; padding:22px 22px 6px;}
  .search-bar{
    display:flex; align-items:center; gap:10px; background:var(--card);
    border:1.5px solid var(--line); border-radius:50px; padding:13px 18px; margin-bottom:16px;
    color:var(--gray);
  }
  .search-bar input{
    border:none; outline:none; background:none; flex:1; font-size:15px; color:var(--ink);
    font-family:'Inter',sans-serif;
  }
  .filter-row{display:flex; gap:9px; overflow-x:auto; padding-bottom:4px; margin-bottom:20px;}
  .filter-chip{
    flex:none; padding:9px 16px; border-radius:24px; border:1.5px solid var(--line);
    background:var(--card); color:var(--ink-soft); font-size:13.5px; font-weight:600;
    cursor:pointer; font-family:'Inter',sans-serif; white-space:nowrap;
  }
  .filter-chip.active{background:var(--coral); border-color:var(--coral); color:#fff;}
  .explore-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  .explore-card{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius-md);
    overflow:hidden; cursor:pointer; box-shadow:0 8px 20px rgba(140,90,50,0.08);
  }
  .explore-card-hero{height:100px; position:relative; overflow:hidden;}
  .explore-card-body{padding:12px 14px 14px;}
  .explore-name{font-weight:700; font-size:15.5px; margin:0 0 3px; font-family:'Poppins',sans-serif;}
  .explore-sub{color:var(--gray); font-size:12.5px; margin:0; line-height:1.4;}
  .explore-tag{
    display:inline-block; margin-top:8px; background:var(--tan-badge); color:var(--ink-soft);
    font-size:11px; font-weight:700; padding:4px 10px; border-radius:20px;
  }
  .profile-row{display:flex; justify-content:space-between; align-items:center; padding:16px 0; border-bottom:1px solid var(--line);}
  .profile-row:last-child{border-bottom:none;}
  .stat-row{display:flex; gap:12px; margin-bottom:22px;}
  .stat-card{
    flex:1; background:var(--card); border:1px solid var(--line); border-radius:var(--radius-md);
    padding:16px 10px; text-align:center; box-shadow:0 8px 20px rgba(140,90,50,0.08);
  }
  .stat-num{font-size:24px; font-weight:800; color:var(--coral); font-family:'Poppins',sans-serif; display:block;}
  .stat-label{font-size:11.5px; color:var(--gray); font-weight:600; margin-top:2px; display:block;}
  .btn-danger-outline{
    width:100%; margin-top:20px; background:var(--card); color:#B3402C; border:1.5px solid #E3B7AA;
    border-radius:50px; padding:15px; font-weight:700; font-size:14.5px; cursor:pointer; font-family:'Inter',sans-serif;
  }
  a{color:inherit;}
  ::selection{background:var(--accent-bg);}
  /* ---------- Infographic summary ---------- */
  .summary-hero{padding:26px 22px 10px;}
  .summary-stat-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin:18px 0;}
  .route-strip{
    display:flex; align-items:center; gap:6px; background:var(--card); border:1px solid var(--line);
    border-radius:var(--radius-md); padding:18px 14px; margin-bottom:18px; box-shadow:0 8px 20px rgba(140,90,50,0.08);
  }
  .route-node{display:flex; flex-direction:column; align-items:center; flex:none; width:74px;}
  .route-dot{width:14px; height:14px; border-radius:50%; background:var(--accent); margin-bottom:6px;}
  .route-label{font-size:11.5px; font-weight:700; text-align:center; line-height:1.25; color:var(--ink-soft);}
  .route-line{flex:1; height:2px; background:var(--line); position:relative; top:-13px;}
  .interest-pill-row{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:20px;}
  .interest-pill{
    background:var(--accent-bg); color:var(--accent); font-size:12.5px; font-weight:700;
    padding:7px 14px; border-radius:20px;
  }
  /* ---------- Print ---------- */
  #print-area{display:none;}
  @media print{
    body *{ visibility:hidden; }
    #print-area, #print-area *{ visibility:visible; }
    #print-area{
      display:block; position:absolute; left:0; top:0; width:100%;
      background:#fff; color:#1a1a1a; padding:0;
    }
    .p-title{font-family:'Poppins',sans-serif; font-size:24px; font-weight:800; margin:0 0 4px;}
    .p-dates{color:#555; font-size:13px; margin:0 0 18px;}
    .p-day{font-family:'Poppins',sans-serif; font-size:16px; font-weight:700; margin:22px 0 10px; border-bottom:2px solid #ddd; padding-bottom:6px;}
    .p-item{display:flex; gap:12px; padding:8px 0; border-bottom:1px solid #eee; page-break-inside:avoid;}
    .p-time{width:64px; flex:none; font-weight:700; font-size:12.5px; color:#222;}
    .p-icon{flex:none; width:20px; color:#444; padding-top:1px;}
    .p-body{flex:1;}
    .p-cat{font-size:9.5px; font-weight:800; letter-spacing:0.05em; text-transform:uppercase; color:#777; margin:0 0 2px;}
    .p-item-title{font-size:13.5px; font-weight:700; margin:0 0 2px; color:#111;}
    .p-item-sub{font-size:11.5px; color:#666; margin:0;}
  }
</style>
</head>
<body>
<div id="shell">
  <div id="screen"></div>
  <div class="navbar" id="navbar"></div>
</div>
<div id="print-area"></div>

/* ============================================================
   HELPERS
============================================================ */
function haversineKm(lat1,lon1,lat2,lon2){
  var R=6371, dLat=(lat2-lat1)*Math.PI/180, dLon=(lon2-lon1)*Math.PI/180;
  var a=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)*Math.sin(dLon/2);
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}
function findDest(name){
  if(!name) return null;
  var k = name.trim().toLowerCase();
  if(DESTS[k]) return DESTS[k];
  for(var key in DESTS){ if(k.indexOf(key)!==-1 || key.indexOf(k)!==-1) return DESTS[key]; }
  return null;
}
function capitalize(s){ if(!s) return s; return s.replace(/\b\w/g, function(c){return c.toUpperCase();}); }
function clamp(n,min,max){ return Math.max(min,Math.min(max,n)); }
function minutesFromTimeStr(t){ if(!t) return 8*60; var p=t.split(":"); return (+p[0])*60+(+p[1]); }
function fmtClock(mins){
  mins = ((mins%1440)+1440)%1440;
  var h=Math.floor(mins/60), m=mins%60;
  var ap = h>=12?"PM":"AM";
  var hh = h%12; if(hh===0) hh=12;
  return {hm: hh+":"+(m<10?"0"+m:m), ap: ap};
}
function addDaysISO(iso, n){
  var d = new Date(iso+"T00:00:00");
  d.setDate(d.getDate()+n);
  return d.toISOString().slice(0,10);
}
function diffDaysISO(a,b){
  var d1=new Date(a+"T00:00:00"), d2=new Date(b+"T00:00:00");
  return Math.round((d2-d1)/86400000);
}
function fmtDateShort(iso){
  var d = new Date(iso+"T00:00:00");
  var months=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  return months[d.getMonth()]+" "+d.getDate();
}
function fmtDur(min){
  if(min<60) return min+"M";
  var h=Math.floor(min/60), m=min%60;
  return h+"H"+(m?" "+m+"M":"");
}
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

/* Age-based max comfortable drive stretch before a break, in minutes */
function ageBreakLimitMinutes(minAge, maxAge){
  var limit = 210; // default adults, 3h30
  if(minAge <= 2) limit = Math.min(limit, 75);
  else if(minAge <= 5) limit = Math.min(limit, 100);
  else if(minAge <= 8) limit = Math.min(limit, 130);
  else if(minAge <= 12) limit = Math.min(limit, 150);
  else if(minAge <= 17) limit = Math.min(limit, 180);
  if(maxAge >= 75) limit = Math.min(limit, 120);
  else if(maxAge >= 65) limit = Math.min(limit, 150);
  return clamp(limit, 60, 210);
}

   GOOGLE MAPS INTEGRATION (Places API (New) + Routes API)
============================================================ */
var MAPS_KEY_STORAGE = "enroute_google_maps_key";
function getMapsKey(){
  try{ return (localStorage.getItem(MAPS_KEY_STORAGE) || "").trim(); }catch(e){ return ""; }
}
function setMapsKey(k){
  try{ localStorage.setItem(MAPS_KEY_STORAGE, (k||"").trim()); return true; }catch(e){ return false; }
}
function hasMapsKey(){ return !!getMapsKey(); }

function placesAutocomplete(input, sessionToken){
  var key = getMapsKey();
  if(!key || !input || input.trim().length<2) return Promise.resolve([]);
  return fetch("https://places.googleapis.com/v1/places:autocomplete", {
    method:"POST",
    headers:{"Content-Type":"application/json", "X-Goog-Api-Key":key},
    body: JSON.stringify({input:input, sessionToken:sessionToken})
  }).then(function(r){ return r.json(); }).then(function(data){
    return (data.suggestions||[]).map(function(s){
      var p = s.placePrediction;
      if(!p || !p.text) return null;
      return {placeId:p.placeId, text:p.text.text};
    }).filter(Boolean);
  }).catch(function(){ return []; });
}

function placeDetails(placeId, sessionToken){
  var key = getMapsKey();
  if(!key || !placeId) return Promise.resolve(null);
  var url = "https://places.googleapis.com/v1/places/"+encodeURIComponent(placeId)+
    (sessionToken ? ("?sessionToken="+encodeURIComponent(sessionToken)) : "");
  return fetch(url, {
    headers:{"X-Goog-Api-Key":key, "X-Goog-FieldMask":"id,displayName,location,formattedAddress"}
  }).then(function(r){ return r.json(); }).then(function(data){
    if(!data || !data.location) return null;
    return {lat:data.location.latitude, lng:data.location.longitude, formattedAddress:data.formattedAddress||""};
  }).catch(function(){ return null; });
}

function geocodeText(text){
  var key = getMapsKey();
  if(!key || !text) return Promise.resolve(null);
  return fetch("https://places.googleapis.com/v1/places:searchText", {
    method:"POST",
    headers:{"Content-Type":"application/json", "X-Goog-Api-Key":key, "X-Goog-FieldMask":"places.location,places.displayName"},
    body: JSON.stringify({textQuery:text, maxResultCount:1})
  }).then(function(r){ return r.json(); }).then(function(d){
    var p = d.places && d.places[0];
    if(!p || !p.location) return null;
    return {name:(p.displayName && p.displayName.text) || text, lat:p.location.latitude, lon:p.location.longitude, source:"geocoded"};
  }).catch(function(){ return null; });
}

function nearbyRestaurants(lat, lon, radiusMeters){
  var key = getMapsKey();
  if(!key || typeof lat!=="number" || typeof lon!=="number") return Promise.resolve([]);
  return fetch("https://places.googleapis.com/v1/places:searchNearby", {
    method:"POST",
    headers:{
      "Content-Type":"application/json", "X-Goog-Api-Key":key,
      "X-Goog-FieldMask":"places.displayName,places.rating,places.userRatingCount,places.formattedAddress"
    },
    body: JSON.stringify({
      includedTypes:["restaurant"],
      maxResultCount:12,
      rankPreference:"POPULARITY",
      locationRestriction:{circle:{center:{latitude:lat, longitude:lon}, radius:radiusMeters||6000}}
    })
  }).then(function(r){ return r.json(); }).then(function(d){ return d.places || []; }).catch(function(){ return []; });
}

function computeRoute(originLat, originLon, destLat, destLon){
  var key = getMapsKey();
  if(!key || typeof originLat!=="number" || typeof destLat!=="number") return Promise.resolve(null);
  return fetch("https://routes.googleapis.com/directions/v2:computeRoutes", {
    method:"POST",
    headers:{
      "Content-Type":"application/json", "X-Goog-Api-Key":key,
      "X-Goog-FieldMask":"routes.duration,routes.distanceMeters,routes.staticDuration"
    },
    body: JSON.stringify({
      origin:{location:{latLng:{latitude:originLat, longitude:originLon}}},
      destination:{location:{latLng:{latitude:destLat, longitude:destLon}}},
      travelMode:"DRIVE",
      routingPreference:"TRAFFIC_AWARE"
    })
  }).then(function(r){ return r.json(); }).then(function(d){
    var route = d.routes && d.routes[0];
    if(!route || !route.duration) return null;
    return {
      durationSec: parseInt(route.duration,10),
      distanceMeters: route.distanceMeters
    };
  }).catch(function(){ return null; });
}

/* Resolve a location string (plus any cached Places selection) to coordinates.
   Priority: a picked autocomplete suggestion > the built-in curated list > a live geocode. */
function resolvePlaceGeo(text, cachedPlace){
  if(cachedPlace && typeof cachedPlace.lat==="number" && typeof cachedPlace.lng==="number"){
    return Promise.resolve({name:cachedPlace.text||text, lat:cachedPlace.lat, lon:cachedPlace.lng, source:"places"});
  }
  var staticMatch = findDest(text);
  if(staticMatch) return Promise.resolve({name:staticMatch.name, lat:staticMatch.lat, lon:staticMatch.lon, source:"static"});
  if(!text || !text.trim() || !hasMapsKey()) return Promise.resolve(null);
  return geocodeText(text.trim());
}

/* Resolve drive distance/duration between two resolved points: live traffic-aware
   route when a Maps key is configured, otherwise the straight-line estimate. */
function resolveRouting(originGeo, destGeo){
  var avgSpeed = 42, roadFactor = 1.32;
  var fallbackKm = (originGeo && destGeo) ? haversineKm(originGeo.lat,originGeo.lon,destGeo.lat,destGeo.lon)*roadFactor : null;
  var fallbackMin = fallbackKm ? Math.round(fallbackKm/avgSpeed*60) : 240;
  var fallback = {km:fallbackKm, min:fallbackMin, source:"estimated"};
  if(!originGeo || !destGeo || !hasMapsKey()) return Promise.resolve(fallback);
  return computeRoute(originGeo.lat, originGeo.lon, destGeo.lat, destGeo.lon).then(function(res){
    if(!res) return fallback;
    return {km: res.distanceMeters/1000, min: Math.max(1,Math.round(res.durationSec/60)), source:"live"};
  });
}

function ratingSubtitle(p){
  var bits = [];
  if(p.rating) bits.push(p.rating.toFixed(1)+"★");
  if(p.userRatingCount) bits.push(p.userRatingCount.toLocaleString()+" reviews");
  var line = bits.join(" · ") || "Real-time Google rating unavailable";
  return p.formattedAddress ? (line+" — "+p.formattedAddress) : line;
}

/* Live nearby restaurants for the destination, ranked by rating weighted by review volume. */
function resolveNearbyFood(destGeo){
  if(!destGeo || !hasMapsKey()) return Promise.resolve([]);
  return nearbyRestaurants(destGeo.lat, destGeo.lon, 6000).then(function(places){
    return places.filter(function(p){ return p.rating && p.displayName; }).map(function(p){
      return {
        title: p.displayName.text,
        subtitle: ratingSubtitle(p),
        score: p.rating * Math.log(1+(p.userRatingCount||0))
      };
    }).sort(function(a,b){ return b.score-a.score; });
  });
}
function pickRealFood(list, usedTitles){
  var candidates = (list||[]).filter(function(p){ return usedTitles.indexOf(p.title)===-1; });
  if(!candidates.length) return null;
  var pick = candidates[0];

function pickCurated(destName, usedTitles, tagFilter, categoryHint){
  var pool = CURATED[destName] || [];
  var candidates = pool.filter(function(p){ return usedTitles.indexOf(p.title)===-1; });
  if(tagFilter && tagFilter.length){
    var tagged = candidates.filter(function(p){
      return p.tags.some(function(t){ return tagFilter.indexOf(t)!==-1; });
    });
    if(tagged.length) candidates = tagged;
  }
  if(categoryHint){
    var byCat = candidates.filter(function(p){ return p.category===categoryHint; });
    if(byCat.length) candidates = byCat;
  }
  if(!candidates.length) return null;
  var pick = candidates[0];
  usedTitles.push(pick.title);

function genericStop(destName, interests, kind){

  if(kind==="food") return {title:"Local eatery near "+destName, subtitle:"Ask your stay for a nearby recommendation."};
  if(kind==="breakfast") return {title:"Breakfast at the stay", subtitle:"Or a nearby local spot recommended by your host."};
  return {title:tag+" spot near "+destName, subtitle:"A short detour worth the stop — check recent reviews before you go."};
}

function buildDriveSegment(items, curMinRef, remainingMin, maxStretch, destLabel, kmTotal){
  var totalMin = remainingMin;
  var covered = 0;
  var breaks = 0;
  while(remainingMin > maxStretch){
    var chunk = maxStretch;
    curMinRef.v += chunk;
    covered += chunk;
    var kmMark = kmTotal ? Math.round(kmTotal * (covered/totalMin)) : null;
    items.push({
      time:curMinRef.v, category:"DRIVE · "+fmtDur(chunk),
      title:"On the road toward "+destLabel,
      subtitle: kmMark ? "Break suggested near the "+kmMark+" km mark." : "Break suggested around here.",
      driveMin: chunk
    });
    items.push({
      time:curMinRef.v, category:"BREAK",
      title:"Stretch break & snacks",
      subtitle:"Quick stop — stretch, hydrate, use the washroom.",
      isBreak:true
    });
    breaks++;
    curMinRef.v += 20;
    remainingMin -= chunk;
  }
  curMinRef.v += remainingMin;
  items.push({
    time:curMinRef.v, category:"DRIVE · "+fmtDur(remainingMin),
    title:"Arrive in "+destLabel,
    subtitle: kmTotal ? Math.round(kmTotal)+" km covered on this leg." : "Estimated leg — add a recognised city name for a precise distance.",
    driveMin: remainingMin,
    km: kmTotal || null
  });
  return breaks;
}

function generateItinerary(trip){
  var dayCount = Math.max(1, diffDaysISO(trip.startDate, trip.endDate)+1);
  var destLabel = capitalize(trip.destination) || "your destination";
  var ages = trip.ages && trip.ages.length ? trip.ages : [30];
  var minAge = Math.min.apply(null,ages), maxAge = Math.max.apply(null,ages);
  var maxStretch = ageBreakLimitMinutes(minAge, maxAge);

  return Promise.all([
    resolvePlaceGeo(trip.destination, trip.destinationPlace),
    resolvePlaceGeo(trip.departureLocation, trip.departurePlace),
    resolvePlaceGeo(trip.returnLocation, trip.returnPlace)
  ]).then(function(geos){
    var destGeo = geos[0], originGeo = geos[1], returnGeoRaw = geos[2];
    var destKey = destGeo ? destGeo.name : null;

    return Promise.all([
      resolveRouting(originGeo, destGeo),
      resolveNearbyFood(destGeo)
    ]).then(function(res){
      var outboundRouting = res[0], realFood = res[1];
      var sameReturn = !returnGeoRaw;
      var returnGeo = returnGeoRaw || originGeo;

      var backRoutingPromise = sameReturn ? Promise.resolve(outboundRouting) : resolveRouting(destGeo, returnGeo);
      return backRoutingPromise.then(function(backRouting){
        var outboundKm = outboundRouting.km, outboundMin = outboundRouting.min;
        var backKm = backRouting.km, backMin = backRouting.min;
        var routingSource = (outboundRouting.source==="live" || backRouting.source==="live") ? "live" : "estimated";
        var usedTitles = [];
        var days = [];

        for(var d=0; d<dayCount; d++){
          var dateISO = addDaysISO(trip.startDate, d);
          var items = [];
          var isFirst = d===0, isLast = d===dayCount-1 && dayCount>1;

          if(isFirst){
            var cur = {v: minutesFromTimeStr(trip.departureTime)};
            items.push({
              time:cur.v, category:"DEPART",
              title:"Leave from "+(trip.departureLocation || "home"),
              subtitle: trip.goals ? "Keep in mind: "+trip.goals : "Keep snacks and water within reach for the road."
            });
            if(dayCount===1){
              // same-day trip: drive there, activity, drive back
              buildDriveSegment(items, cur, outboundMin, maxStretch, destLabel, outboundKm);
              var act = pickCurated(destKey, usedTitles, trip.interests, "SIGHTSEEING") ;
              cur.v += 60;
              if(act) items.push({time:cur.v, category:act.category, title:act.title, subtitle:act.subtitle});
              else { var g=genericStop(destLabel, trip.interests,"sight"); items.push({time:cur.v, category:"SIGHTSEEING", title:g.title, subtitle:g.subtitle}); }
              cur.v += 150;
              var returnKm = outboundKm;
              buildDriveSegment(items, cur, outboundMin, maxStretch, (trip.returnLocation||trip.departureLocation||"home"), returnKm);
            } else {
              buildDriveSegment(items, cur, outboundMin, maxStretch, destLabel, outboundKm);
              cur.v += 60;
              var act1 = pickCurated(destKey, usedTitles, trip.interests, "SIGHTSEEING");
              if(act1) items.push({time:cur.v, category:act1.category, title:act1.title, subtitle:act1.subtitle});
              else { var g1=genericStop(destLabel, trip.interests,"sight"); items.push({time:cur.v, category:"SIGHTSEEING", title:g1.title, subtitle:g1.subtitle}); }
              var stayTime = Math.max(cur.v+150, 19*60);
              items.push({time:stayTime, category:"STAY", title:"Check in, "+(STAY_LABELS[trip.stayType]||"stay").toLowerCase(), subtitle: trip.stayNotes || "Settle in and rest up for tomorrow."});
            }
          } else if(isLast){
            var cur2 = {v: 9*60};
            var bf = pickRealFood(realFood, usedTitles) || pickCurated(destKey, usedTitles, trip.interests, "BREAKFAST");
            if(bf) items.push({time:cur2.v, category:"BREAKFAST", title:bf.title, subtitle:bf.subtitle});
            else { var gb=genericStop(destLabel, trip.interests,"breakfast"); items.push({time:cur2.v, category:"BREAKFAST", title:gb.title, subtitle:gb.subtitle}); }
            items.push({time:cur2.v+60, category:"CHECKOUT", title:"Check out", subtitle:"Settle up and pack the car."});
            cur2.v += 90;
            buildDriveSegment(items, cur2, backMin, maxStretch, trip.returnLocation || trip.departureLocation || "home", backKm);
            items.push({
              time:cur2.v, category:"ARRIVE",
              title:"Back at "+(trip.returnLocation || trip.departureLocation || "home"),
              subtitle:"Target return time was "+fmtClock(minutesFromTimeStr(trip.returnTime)).hm+" "+fmtClock(minutesFromTimeStr(trip.returnTime)).ap+"."
            });
          } else {
            var cur3 = {v: 8*60+30};
            var bf2 = pickRealFood(realFood, usedTitles) || pickCurated(destKey, usedTitles, trip.interests, "BREAKFAST");
            if(bf2) items.push({time:cur3.v, category:"BREAKFAST", title:bf2.title, subtitle:bf2.subtitle});
            else { var gb2=genericStop(destLabel, trip.interests,"breakfast"); items.push({time:cur3.v, category:"BREAKFAST", title:gb2.title, subtitle:gb2.subtitle}); }
            cur3.v += 90;
            var s1 = pickCurated(destKey, usedTitles, trip.interests, "SIGHTSEEING") || pickCurated(destKey, usedTitles, trip.interests, "WILDLIFE");
            if(s1) items.push({time:cur3.v, category:s1.category, title:s1.title, subtitle:s1.subtitle});
            else { var g2=genericStop(destLabel, trip.interests,"sight"); items.push({time:cur3.v, category:"SIGHTSEEING", title:g2.title, subtitle:g2.subtitle}); }
            cur3.v += 180;
            var f1 = pickRealFood(realFood, usedTitles) || pickCurated(destKey, usedTitles, trip.interests, "FOOD");
            if(f1) items.push({time:cur3.v, category:"FOOD", title:f1.title, subtitle:f1.subtitle});
            else { var gf=genericStop(destLabel, trip.interests,"food"); items.push({time:cur3.v, category:"FOOD", title:gf.title, subtitle:gf.subtitle}); }
            cur3.v += 240;
            var s2 = pickCurated(destKey, usedTitles, trip.interests, "SIGHTSEEING");
            if(s2) items.push({time:cur3.v, category:s2.category, title:s2.title, subtitle:s2.subtitle});
            items.push({time:19*60+30, category:"STAY", title:"Evening back at the stay", subtitle:"Dinner and downtime."});
          }

          items.sort(function(a,b){ return a.time-b.time; });
          days.push({label:"Day "+(d+1), date:dateISO, items:items});
        }

        var totalDriveMin = 0, totalKm = 0, totalBreaks = 0;
        days.forEach(function(day){
          day.items.forEach(function(item){
            if(typeof item.driveMin==="number") totalDriveMin += item.driveMin;
            if(typeof item.km==="number") totalKm += item.km;
            if(item.isBreak) totalBreaks++;
          });
        });
        var stats = {
          totalDriveMin: totalDriveMin,
          totalKm: Math.round(totalKm),
          totalBreaks: totalBreaks,
          dayCount: dayCount,
          maxStretchMin: maxStretch
        };
        return {days: days, stats: stats, routingSource: routingSource};
      });
    });
  });
}

var FEATURED = ["Goa","Munnar","Coorg","Wayanad","Alleppey","Ooty","Hampi"];
function destDominantTag(name){
  var pool = CURATED[name];
  if(!pool) return "nature";
  var counts = {};
  pool.forEach(function(p){ p.tags.forEach(function(t){ counts[t]=(counts[t]||0)+1; }); });
  var best=null, bestC=0;
  Object.keys(counts).forEach(function(k){ if(counts[k]>bestC){ best=k; bestC=counts[k]; } });
  return best || "nature";
}
function filteredFeatured(){
  var q = (state.exploreQuery||"").trim().toLowerCase();
  var f = state.exploreFilter||"all";
  return FEATURED.filter(function(name){
    var tag = destDominantTag(name);
    var matchesFilter = f==="all" || tag===f;
    var matchesQuery = !q || name.toLowerCase().indexOf(q)!==-1;
    return matchesFilter && matchesQuery;
  });
}
function renderExploreGridItems(){
  var list = filteredFeatured();
  if(!list.length) return '<p class="empty-note">No destinations match that search yet.</p>';

  }
  else if(step==="intention"){
    html += '<h2 class="wizard-title">What is this trip for?</h2><p class="wizard-sub">Pick what best describes the trip intent.</p>';
    html += chipGroup("intention", d.intention, INTENTION_LABELS, false);
  }
  else if(step==="travelers"){
    html += '<h2 class="wizard-title">Who is travelling?</h2><p class="wizard-sub">Ages help set a comfortable driving pace.</p>';
    html += '<div class="field"><label>Number of travelers</label><div class="stepper-row">';
    html += '<button class="stepper-btn" data-action="travelers-dec">−</button><span style="font-size:18px; font-weight:700; width:24px; text-align:center;">'+d.travelers+'</span><button class="stepper-btn" data-action="travelers-inc">+</button>';
    html += '</div></div>';
    html += '<div class="field"><label>Ages</label>';
    for(var i=0;i<d.travelers;i++){
      html += '<div class="traveler-row"><span>Traveler '+(i+1)+'</span><input type="number" min="0" max="110" data-field="age" data-idx="'+i+'" value="'+(d.ages[i]!=null?d.ages[i]:"")+'"></div>';
    }
    html += '</div>';
  }
  else if(step==="goals"){
    html += '<h2 class="wizard-title">Anything not to miss?</h2><p class="wizard-sub">Important goals for the trip — a place, an activity, a feeling.</p>';
    html += fieldTextarea("Trip goals","goals", d.goals, "e.g. relax on the beach, try local seafood, get some good photos");
  }
  else if(step==="food"){
    html += '<h2 class="wizard-title">Food preferences</h2><p class="wizard-sub">Pick as many as apply.</p>';
    html += chipGroup("foodPrefs", d.foodPrefs, FOOD_LABELS, true);
    html += fieldText("Allergies or things to avoid","foodAllergies", d.foodAllergies, "Optional");
  }
  else if(step==="stay"){
    html += '<h2 class="wizard-title">Where will you stay?</h2><p class="wizard-sub">Pick a rough category — you can always change bookings later.</p>';
    html += chipGroup("stayType", d.stayType, STAY_LABELS, false);
    html += fieldText("Anything specific about your stay","stayNotes", d.stayNotes, "e.g. need a pool, pet-friendly");
  }
  else if(step==="interests"){
    html += '<h2 class="wizard-title">What draws you in?</h2><p class="wizard-sub">Pick your interests in order of priority — the first one sets the color theme for this trip.</p>';
    html += chipGroupOrdered("interests", d.interests, INTEREST_LABELS);
  }
  else if(step==="review"){
    html += '<h2 class="wizard-title">Review your trip</h2><p class="wizard-sub">Everything below will be used to build your itinerary.</p>';
    html += reviewBlock("Destination", capitalize(d.destination)||"—");
    html += reviewBlock("Dates", (d.startDate&&d.endDate)?(fmtDateShort(d.startDate)+" – "+fmtDateShort(d.endDate)):"—");
    html += reviewBlock("Route", (d.departureLocation||"—")+" → "+(capitalize(d.destination)||"—")+" → "+(d.returnLocation||d.departureLocation||"—"));
    html += reviewBlock("Intention", INTENTION_LABELS[d.intention]);
    html += reviewBlock("Travelers", d.travelers+" ("+d.ages.join(", ")+" yrs)");
    html += reviewBlock("Goals", d.goals || "—");
    html += reviewBlock("Food", (d.foodPrefs.map(function(k){return FOOD_LABELS[k];}).join(", ")||"—")+(d.foodAllergies?(" · avoid: "+d.foodAllergies):""));
    html += reviewBlock("Stay", STAY_LABELS[d.stayType]+(d.stayNotes?(" · "+d.stayNotes):""));
    html += reviewBlock("Interests", d.interests.map(function(k){return INTEREST_LABELS[k];}).join(", ")||"—");
    if(!d.destination || !d.startDate || !d.endDate){
      html += '<div class="info-note">Add at least a destination and dates before generating the itinerary.</div>';
    }
  }

  html += '</div>';
  html += '<div class="wizard-nav">';
  if(w.step>0) html += '<button class="btn-secondary" data-action="wizard-prev">Back</button>';
  if(step==="review"){
    html += '<button class="btn-primary" data-action="wizard-generate">Generate itinerary</button>';
  } else {
    html += '<button class="btn-primary" data-action="wizard-next">Continue</button>';
  }
  html += '</div>';
  return html;
}

function fieldText(label, field, value, placeholder){
  return '<div class="field"><label>'+label+'</label><input type="text" data-field="'+field+'" value="'+esc(value)+'" placeholder="'+esc(placeholder||"")+'"></div>';
}
function fieldPlaceAutocomplete(label, field, value, placeholder){
  var html = '<div class="field ac-field"><label>'+label+'</label>'+
    '<input type="text" data-field="'+field+'" data-ac="1" autocomplete="off" value="'+esc(value)+'" placeholder="'+esc(placeholder||"")+'">'+
    '<div class="ac-list" id="ac-list-'+field+'"></div>';
  if(!hasMapsKey()) html += '<p style="font-size:12px; color:var(--gray); margin:7px 2px 0;">Add a Google Maps API key in Profile to search real places.</p>';
  html += '</div>';
  return html;
}
function fieldTextarea(label, field, value, placeholder){
  return '<div class="field"><label>'+label+'</label><textarea data-field="'+field+'" placeholder="'+esc(placeholder||"")+'">'+esc(value)+'</textarea></div>';
}
function fieldDate(label, field, value){
  return '<div class="field"><label>'+label+'</label><input type="date" data-field="'+field+'" value="'+esc(value)+'"></div>';
}
function fieldTime(label, field, value){
  return '<div class="field"><label>'+label+'</label><input type="time" data-field="'+field+'" value="'+esc(value)+'"></div>';
}
function chipGroup(field, current, labels, multi){
  var html = '<div class="field"><div class="chip-wrap">';
  Object.keys(labels).forEach(function(k){
    var selected = multi ? current.indexOf(k)!==-1 : current===k;
    html += '<button class="chip '+(selected?"selected":"")+'" data-action="chip" data-field="'+field+'" data-value="'+k+'" data-multi="'+(multi?"1":"0")+'">'+labels[k]+'</button>';
  });
  html += '</div></div>';
  return html;
}
function chipGroupOrdered(field, current, labels){
  var html = '<div class="field"><div class="chip-wrap">';
  Object.keys(labels).forEach(function(k){
    var idx = current.indexOf(k);
    var selected = idx!==-1;
    html += '<button class="chip '+(selected?"selected":"")+'" data-action="chip" data-field="'+field+'" data-value="'+k+'" data-multi="1">'+(selected?'<span class="order-badge">'+(idx+1)+'</span>':'')+labels[k]+'</button>';
  });
  html += '</div></div>';
  return html;
}
function reviewBlock(label, value){
  return '<div class="review-block"><p class="review-label">'+label+'</p><p class="review-value">'+esc(value)+'</p></div>';
}

/* ============================================================
   MAIN RENDER
============================================================ */
function render(){
  var screenEl = document.getElementById("screen");
  var navEl = document.getElementById("navbar");
  var html = "";
  if(state.screen==="home") html = renderHome();
  else if(state.screen==="wizard") html = renderWizard();
  else if(state.screen==="timeline") html = renderTimeline();
  else if(state.screen==="trips") html = renderTripsList();
  else if(state.screen==="explore") html = renderExplore();
  else if(state.screen==="profile") html = renderProfile();
  else if(state.screen==="summary") html = renderSummary();
  else if(state.screen==="generating") html = renderGenerating();
  screenEl.innerHTML = html;
  navEl.innerHTML = renderNavbar();
  screenEl.scrollTop = 0;
}

/* ============================================================
   EVENTS
============================================================ */
document.getElementById("screen").addEventListener("click", handleClick);
document.getElementById("navbar").addEventListener("click", handleClick);
document.getElementById("screen").addEventListener("input", handleInput);

function handleInput(e){
  var t = e.target;
  var field = t.getAttribute("data-field");
  if(!field) return;
  if(field==="exploreQuery"){
    state.exploreQuery = t.value;
    var gridEl = document.getElementById("explore-grid");
    if(gridEl) gridEl.innerHTML = renderExploreGridItems();
    return;
  }
  if(!state.wizard) return;
  var d = state.wizard.data;
  if(field==="age"){
    var idx = +t.getAttribute("data-idx");
    d.ages[idx] = t.value === "" ? null : (+t.value);
  } else if(t.type==="number"){
    d[field] = t.value===""?"":(+t.value);
  } else {
    d[field] = t.value;
    if(t.getAttribute("data-ac")==="1"){
      d[PLACE_FIELD_MAP[field]] = null;
      scheduleAutocomplete(field, t.value);
    }
  }
  // no re-render — avoids losing focus while typing
}

/* ---------- Places autocomplete dropdown wiring ---------- */
var acDebounceTimers = {};
var acSessionTokens = {};
function scheduleAutocomplete(field, text){
  clearTimeout(acDebounceTimers[field]);
  var listEl = document.getElementById("ac-list-"+field);
  if(!listEl) return;
  if(!hasMapsKey() || !text || text.trim().length<2){
    listEl.classList.remove("show");
    listEl.innerHTML = "";
    return;
  }
  acDebounceTimers[field] = setTimeout(function(){
    if(!acSessionTokens[field]) acSessionTokens[field] = uid();
    placesAutocomplete(text, acSessionTokens[field]).then(function(suggestions){
      renderAutocompleteList(field, suggestions);
    });
  }, 300);
}
function renderAutocompleteList(field, suggestions){
  var listEl = document.getElementById("ac-list-"+field);
  if(!listEl) return;
  if(!suggestions.length){ listEl.classList.remove("show"); listEl.innerHTML = ""; return; }
  listEl.innerHTML = suggestions.map(function(s){
    return '<div class="ac-item" data-action="pick-place" data-field="'+field+'" data-place-id="'+esc(s.placeId)+'" data-text="'+esc(s.text)+'">'+esc(s.text)+'</div>';
  }).join("");
  listEl.classList.add("show");
}
document.addEventListener("click", function(e){
  if(e.target.closest(".ac-field")) return;
  document.querySelectorAll(".ac-list.show").forEach(function(el){
    el.classList.remove("show");
    el.innerHTML = "";
  });
});

function handleClick(e){
  var el = e.target.closest("[data-action]");
  if(!el) return;
  var action = el.getAttribute("data-action");

  if(action==="nav"){
    var target = el.getAttribute("data-target");
    state.screen = target;
    state.moreMenuOpen = false;
    render();
  }
  else if(action==="start-wizard"){
    state.wizard = newWizard();
    state.screen = "wizard";
    render();
  }
  else if(action==="explore-dest"){
    state.wizard = newWizard(el.getAttribute("data-name"));
    state.screen = "wizard";
    render();
  }
  else if(action==="explore-filter"){
    state.exploreFilter = el.getAttribute("data-value");
    render();
  }
  else if(action==="wizard-back-top"){
    if(state.wizard.step===0){ state.wizard=null; state.screen="home"; }
    else { state.wizard.step--; }
    render();
  }
  else if(action==="wizard-prev"){
    state.wizard.step = Math.max(0, state.wizard.step-1);
    render();
  }
  else if(action==="wizard-next"){
    state.wizard.step = Math.min(STEPS.length-1, state.wizard.step+1);
    render();
  }
  else if(action==="wizard-generate"){
    submitWizard();
  }
  else if(action==="chip"){
    var field2 = el.getAttribute("data-field");
    var value = el.getAttribute("data-value");
    var multi = el.getAttribute("data-multi")==="1";
    var d2 = state.wizard.data;
    if(multi){
      var arr = d2[field2];
      var idx2 = arr.indexOf(value);
      if(idx2===-1) arr.push(value); else arr.splice(idx2,1);
    } else {
      d2[field2] = value;
    }
    render();
  }
  else if(action==="travelers-inc"){
    var d3 = state.wizard.data;
    d3.travelers = Math.min(10, d3.travelers+1);
    while(d3.ages.length < d3.travelers) d3.ages.push(30);
    render();
  }
  else if(action==="travelers-dec"){
    var d4 = state.wizard.data;
    d4.travelers = Math.max(1, d4.travelers-1);
    d4.ages = d4.ages.slice(0, d4.travelers);
    render();
  }
  else if(action==="open-trip"){
    state.currentTripId = el.getAttribute("data-id");
    state.activeDay = 0;
    state.screen = "timeline";
    state.moreMenuOpen = false;
    render();
  }
  else if(action==="set-day"){
    state.activeDay = +el.getAttribute("data-idx");
    render();
  }
  else if(action==="toggle-more"){
    state.moreMenuOpen = !state.moreMenuOpen;
    render();
  }
  else if(action==="delete-trip"){
    var id = el.getAttribute("data-id");
    if(confirm("Delete this trip? This can't be undone.")){
      state.trips = state.trips.filter(function(t){ return t.id!==id; });
      saveTrips(state.trips);
      state.screen = "home";
    }
    state.moreMenuOpen = false;
    render();
  }
  else if(action==="clear-all"){
    if(confirm("Delete all saved trips from this browser?")){
      state.trips = [];
      saveTrips(state.trips);
      render();
    }
  }
  else if(action==="export-pdf"){
    exportTripPDF();
  }
  else if(action==="print-itinerary"){
    printItinerary();
  }
  else if(action==="pick-place"){
    if(!state.wizard) return;
    var field5 = el.getAttribute("data-field");
    var placeId5 = el.getAttribute("data-place-id");
    var text5 = el.getAttribute("data-text");
    var d5 = state.wizard.data;
    d5[field5] = text5;
    var listEl3 = document.getElementById("ac-list-"+field5);
    if(listEl3){ listEl3.classList.remove("show"); listEl3.innerHTML=""; }
    var inputEl = document.querySelector('input[data-field="'+field5+'"]');
    if(inputEl) inputEl.value = text5;
    var token5 = acSessionTokens[field5];
    delete acSessionTokens[field5];
    placeDetails(placeId5, token5).then(function(details){
      if(details) d5[PLACE_FIELD_MAP[field5]] = {placeId:placeId5, text:text5, lat:details.lat, lng:details.lng};
    });
  }
  else if(action==="save-maps-key"){
    var keyInput = document.getElementById("maps-key-input");
    setMapsKey(keyInput ? keyInput.value : "");
    render();
  }
}

function submitWizard(){
  var d = state.wizard.data;
  if(!d.destination || !d.startDate || !d.endDate){ return; }
  var trip = {
    id: uid(),
    title: capitalize(d.destination)+" Trip",
    destination: d.destination, destinationPlace: d.destinationPlace,
    startDate: d.startDate, endDate: d.endDate,
    departureLocation: d.departureLocation, departurePlace: d.departurePlace, departureTime: d.departureTime,
    returnLocation: d.returnLocation, returnPlace: d.returnPlace, returnTime: d.returnTime,
    intention: d.intention,
    travelers: d.travelers, ages: d.ages.map(function(a){ return a==null?30:a; }),
    goals: d.goals,
    foodPrefs: d.foodPrefs, foodAllergies: d.foodAllergies,
    stayType: d.stayType, stayNotes: d.stayNotes,
    interests: d.interests,
    createdAt: Date.now()
  };
  state.wizard = null;
  state.screen = "generating";
  render();
  generateItinerary(trip).then(function(built){
    trip.days = built.days;
    trip.stats = built.stats;
    trip.routingSource = built.routingSource;
    state.trips.push(trip);
    saveTrips(state.trips);
    state.currentTripId = trip.id;
    state.activeDay = 0;
    state.screen = "timeline";
    render();
  }).catch(function(err){
    console.error("Itinerary generation failed", err);
    alert("Something went wrong building the itinerary. Please try again.");
    state.wizard = newWizard(d.destination);
    state.wizard.data = d;
    state.screen = "wizard";
    render();
  });
}

/* ============================================================
   PDF EXPORT
============================================================ */
function printItinerary(){
  var trip = state.trips.find(function(t){ return t.id===state.currentTripId; });
  if(!trip) return;
  var area = document.getElementById("print-area");
  var html = '<p class="p-title">'+esc(trip.title)+'</p>';
  html += '<p class="p-dates">'+fmtDateShort(trip.startDate)+' – '+fmtDateShort(trip.endDate)+' · '+trip.days.length+' day(s) · '+trip.travelers+' traveler(s)</p>';
  trip.days.forEach(function(day){
    html += '<p class="p-day">'+day.label+' — '+fmtDateShort(day.date)+'</p>';
    day.items.forEach(function(item){
      var t = fmtClock(item.time);
      html += '<div class="p-item">';
      html += '<div class="p-time">'+t.hm+' '+t.ap+'</div>';
      html += '<div class="p-icon">'+categoryIcon(item.category)+'</div>';
      html += '<div class="p-body"><p class="p-cat">'+esc(item.category)+'</p><p class="p-item-title">'+esc(item.title)+'</p><p class="p-item-sub">'+esc(item.subtitle)+'</p></div>';
      html += '</div>';
    });
  });
  area.innerHTML = html;
  setTimeout(function(){ window.print(); }, 60);
}

function exportTripPDF(){
  var trip = state.trips.find(function(t){ return t.id===state.currentTripId; });
  if(!trip) return;
  try{
    var jsPDFCtor = window.jspdf ? window.jspdf.jsPDF : null;
    if(!jsPDFCtor){ fallbackPrint(trip); return; }
    var doc = new jsPDFCtor({unit:"pt", format:"a4"});
    var pageW = doc.internal.pageSize.getWidth();
    var margin = 48, y = margin;

    doc.setFont("helvetica","bold"); doc.setFontSize(20);
    doc.text(trip.title, margin, y); y += 22;
    doc.setFont("helvetica","normal"); doc.setFontSize(11); doc.setTextColor(110,105,95);
    doc.text(fmtDateShort(trip.startDate)+" - "+fmtDateShort(trip.endDate)+" | "+trip.days.length+" day(s)", margin, y);
    doc.setTextColor(30,27,22);
    y += 22;

    var stats = getTripStats(trip);
    doc.setFont("helvetica","bold"); doc.setFontSize(10.5); doc.setTextColor(90,85,75);
    var summaryLine = "Est. drive time: "+fmtDur(stats.totalDriveMin)+"   |   Est. distance: "+(stats.totalKm?("~"+stats.totalKm+" km"):"n/a")+"   |   Breaks planned: "+stats.totalBreaks+"   |   Travelers: "+trip.travelers;
    doc.text(summaryLine, margin, y);
    doc.setTextColor(30,27,22);
    y += 24;

    trip.days.forEach(function(day){
      if(y > 730){ doc.addPage(); y = margin; }
      doc.setFont("helvetica","bold"); doc.setFontSize(14);
      doc.text(day.label+" - "+fmtDateShort(day.date), margin, y); y += 18;
      doc.setDrawColor(220,213,196); doc.line(margin, y-8, pageW-margin, y-8);

      day.items.forEach(function(item){
        if(y > 760){ doc.addPage(); y = margin; }
        var t = fmtClock(item.time);
        doc.setFont("helvetica","bold"); doc.setFontSize(10);
        doc.text(t.hm+" "+t.ap, margin, y);
        doc.setFont("helvetica","bold"); doc.setFontSize(9);
        doc.text(item.category, margin+70, y);
        y += 13;
        doc.setFont("helvetica","bold"); doc.setFontSize(11.5);
        var titleLines = doc.splitTextToSize(item.title, pageW-2*margin-70);
        doc.text(titleLines, margin+70, y);
        y += titleLines.length*13;
        doc.setFont("helvetica","normal"); doc.setFontSize(10); doc.setTextColor(120,114,101);
        var subLines = doc.splitTextToSize(item.subtitle||"", pageW-2*margin-70);
        doc.text(subLines, margin+70, y);
        doc.setTextColor(30,27,22);
        y += subLines.length*12 + 12;
      });
      y += 6;
    });

    var blob = doc.output("blob");
    var filename = trip.title.replace(/[^a-z0-9]+/gi,"_")+".pdf";

    if(window.claude && window.claude.use){
      window.claude.use("downloads").then(function(downloads){
        if(!downloads){ triggerBlobFallback(blob, filename); return; }
        downloads.save({filename:filename, data:blob}).catch(function(err){
          if(err && err.code!=="declined"){ triggerBlobFallback(blob, filename); }
        });
      }).catch(function(){ triggerBlobFallback(blob, filename); });
    } else {
      triggerBlobFallback(blob, filename);
    }
  } catch(e){
    fallbackPrint(trip);
  }
}
function triggerBlobFallback(blob, filename){
  try{
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click();
    setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(url); }, 500);
  }catch(e){}
}
function fallbackPrint(trip){
  window.print();
}

/* ============================================================
   INIT
============================================================ */
render();
